name: Weekly REIT Scrape

on:
  schedule:
    # Sunday 08:00 UTC = Sat 11 PM PT / Sun 1 AM CT / 4 AM ET
    # Fires the morning after the Saturday week anchor.
    - cron: '0 8 * * 0'
  workflow_dispatch:        # allow manual trigger from the Actions tab

permissions:
  contents: write           # weekly_run.py commits + pushes raw CSVs and summary_history

concurrency:
  group: weekly-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright + Chromium
        run: python -m playwright install --with-deps chromium

      - name: Configure git identity
        run: |
          git config user.name  "CRE Data"
          git config user.email "noreply@public-cre-data.github.io"

      - name: Run weekly pipeline
        run: python weekly_run.py

      - name: Upload audit logs + workbooks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-${{ github.run_id }}
          path: |
            logs/
            output/REIT_Research_Charts_*.xlsx
            REIT_Rental_Analysis_*.xlsx
          retention-days: 30
